[project]
name = "lattice"
version = "0.1.0"
description = "Forgeway backend: content engine, grader orchestration, progression and API."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.54.0",
  "pydantic[email]>=2.14.1",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.3.6",
  "argon2-cffi>=23.1",
  "pyyaml>=6.0",
  "typer>=0.13",
  "tzdata>=2024.2",
  "pillow>=11.0",
]

[project.scripts]
forgeway = "lattice.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lattice"]
