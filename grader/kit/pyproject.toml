# The learner toolkit on its own, for local live mode (docs/live-mode.md). The grader's own
# pyproject ships lattice_grader too; this one packages forgeway_kit only.
#
#   uv build --wheel grader/kit -o dist/kit
#
# The API serves the wheel at /kit/<file name> and /kit/latest (LATTICE_KIT_DIR).
[project]
name = "forgeway-kit"
version = "2.0.0"
description = "The Forgeway learner toolkit: model client types, the fake and live clients."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"../src/forgeway_kit" = "forgeway_kit"
