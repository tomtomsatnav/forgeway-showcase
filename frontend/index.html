<!doctype html>
<html lang="en-GB" data-mode="professional" data-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forgeway</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700&family=Alegreya+Sans:wght@400;500;700&family=Alegreya:ital,wght@0,400..700;1,400..700&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the stored theme before first paint so there is no flash of the wrong palette.
      try {
        var t = JSON.parse(localStorage.getItem('lattice.theme') || '{}');
        var r = document.documentElement;
        var s = t.scheme || 'system';
        if (s === 'system')
          s = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        r.dataset.mode = t.mode === 'rpg' ? 'rpg' : 'professional';
        r.dataset.scheme = s === 'dark' ? 'dark' : 'light';
      } catch (e) {
        /* storage unavailable: the defaults above apply */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
