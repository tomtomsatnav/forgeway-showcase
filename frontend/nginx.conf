server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the API through Docker's DNS at request time, not once at start-up: a deploy that
    # recreates the API gives it a new address, and a cached one answers 502 until nginx restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # Keep the browser's Host header: the API refuses mutations whose Origin does not match it.
    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(healthz|readyz)$ {
        proxy_pass $api;
        proxy_set_header Host $http_host;
    }

    # Public certificate pages and images are rendered by the API (they need OpenGraph tags).
    location ~ ^/c/ {
        proxy_pass $api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # History fallback for client-side routes such as /exercises/starter.first-completion.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
