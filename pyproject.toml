[project]
name = "lattice-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["lattice", "lattice-grader"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "grader"]

[tool.uv.sources]
lattice = { workspace = true }
lattice-grader = { workspace = true }

[dependency-groups]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.115",
  "import-linter>=2.1",
  "pre-commit>=4.0",
  "types-PyYAML",
  "httpx>=0.27,<0.29",
  "mcp>=2.3.0",
  "jsonschema>=4.23",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PTH", "S", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["lattice", "lattice_grader", "forgeway_kit", "tests"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "ANN", "S603", "S607"]
"content/**" = ["S101", "ANN", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "grader/tests"]
pythonpath = ["backend"]
addopts = "-ra --strict-markers"
markers = ["docker: needs a Docker daemon"]

[tool.importlinter]
root_packages = ["lattice"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is independent of every outer layer"
type = "forbidden"
source_modules = ["lattice.domain"]
forbidden_modules = [
  "lattice.application",
  "lattice.infrastructure",
  "lattice.api",
  "lattice.worker",
  "lattice.settings",
  "fastapi",
  "sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "Layers point inwards"
type = "layers"
layers = [
  "lattice.cli",
  "lattice.api | lattice.worker",
  "lattice.application",
  "lattice.infrastructure",
  "lattice.domain",
]
