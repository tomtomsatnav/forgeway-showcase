# Specialisation paths of the free showcase.
paths:
- id: protocols
  title: Integration specialist
  summary: Connects models to tools and data over MCP, and keeps what comes back in its place.
  home_branch: protocols
- id: orchestration
  title: Systems specialist
  summary: Composes agents into systems that stay within budget and recover from failure.
  home_branch: orchestration
- id: knowledge-graphs
  title: Knowledge engineer
  summary: Turns documents into graphs that answer multi-hop questions and show their working.
  home_branch: knowledge-graphs
- id: memory
  title: Memory engineer
  summary: Gives agents memory that is useful, private and willing to forget.
  home_branch: memory
- id: context-engineering
  title: Context engineer
  summary: Decides exactly what a model sees, in what order, within budget and cache-friendly.
  home_branch: context-engineering
- id: evals
  title: Evaluation engineer
  summary: Measures model behaviour honestly and guards it in production.
  home_branch: evals
