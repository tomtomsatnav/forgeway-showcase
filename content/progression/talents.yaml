# The talent tree of the free showcase: only talents gated on free exercises.
nodes:
- id: steady-hands
  title: Steady hands
  summary: You can get a model to answer from code.
  min_level: 2
  required_exercises:
  - starter.first-completion
  effects:
  - title: Prompt engineer
- id: prompt-craft
  title: Prompt craft
  summary: You steer behaviour with system prompts and examples.
  parents:
  - steady-hands
  min_level: 2
  required_exercises:
  - starter.system-prompts
  effects:
  - title: Prompt crafter
- id: context-keeper
  title: Context keeper
  summary: You keep conversations coherent inside a finite context window.
  parents:
  - steady-hands
  min_level: 3
  required_exercises:
  - starter.tokens-and-context
  - starter.conversation-history
  effects:
  - title: Context keeper
- id: resilient-caller
  title: Resilient caller
  summary: Your calls survive rate limits, failures and truncated replies.
  parents:
  - context-keeper
  min_level: 4
  required_exercises:
  - starter.retries-and-backoff
  - starter.handling-truncation
  effects:
  - title: Resilient caller
- id: guarded-builder
  title: Guarded builder
  summary: You give models tools and defend them against hostile input.
  parents:
  - prompt-craft
  min_level: 4
  required_exercises:
  - starter.prompt-injection-basics
  - starter.tool-use
  effects:
  - title: Guarded builder
  - reference_solutions: starter
- id: production-caller
  title: Production caller
  summary: You stream replies, constrain their shape and know what every call costs.
  parents:
  - resilient-caller
  min_level: 5
  required_exercises:
  - starter.streaming-responses
  - starter.schema-constrained-output
  - starter.cost-and-latency
  effects:
  - title: Production caller
- id: wire-speaker
  title: Wire speaker
  summary: You speak JSON-RPC and complete the MCP handshake by the book.
  subtree: protocols
  min_level: 3
  required_exercises:
  - protocols.json-rpc-dispatch
  - protocols.initialize-handshake
  effects:
  - title: Protocol speaker
- id: dispatcher
  title: Dispatcher
  summary: You route each request to the right specialist and chain steps behind gates.
  subtree: orchestration
  min_level: 3
  required_exercises:
  - orchestration.router
  - orchestration.prompt-chaining
  effects:
  - title: Dispatcher
- id: second-opinion
  title: Second opinion
  summary: You loop a generator against an evaluator until the work is good enough.
  subtree: orchestration
  parents:
  - dispatcher
  min_level: 4
  required_exercises:
  - orchestration.evaluator-optimiser
  effects:
  - title: Critic
- id: graph-keeper
  title: Graph keeper
  summary: You store facts as triples and resolve the entities they name.
  subtree: knowledge-graphs
  min_level: 3
  required_exercises:
  - knowledge-graphs.triple-store
  - knowledge-graphs.entity-resolution
  effects:
  - title: Graph keeper
- id: timekeeper
  title: Timekeeper
  summary: Your graphs know when each fact was true.
  subtree: knowledge-graphs
  parents:
  - graph-keeper
  min_level: 4
  required_exercises:
  - knowledge-graphs.temporal-edges
  effects:
  - title: Timekeeper
- id: note-taker
  title: Note taker
  summary: You keep a rolling summary and a store of facts that resolves contradictions.
  subtree: memory
  min_level: 3
  required_exercises:
  - memory.rolling-summary
  - memory.semantic-facts
  effects:
  - title: Note taker
- id: budgeteer
  title: Budgeteer
  summary: You assemble prompts under budget in sections nothing can break out of.
  subtree: context-engineering
  min_level: 3
  required_exercises:
  - context-engineering.token-budget
  - context-engineering.structured-sections
  effects:
  - title: Budgeteer
- id: measurer
  title: Measurer
  summary: You score outputs with metrics you can state exactly.
  subtree: evals
  min_level: 3
  required_exercises:
  - evals.eval-metrics
  - evals.pii-redaction
  effects:
  - title: Measurer
