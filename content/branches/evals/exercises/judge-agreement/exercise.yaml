version: 3
title: Does the judge agree with people? Cohen's kappa
tier: intermediate
xp: 125
prerequisites: [evals.eval-metrics]
skills: [llm-as-judge, agreement, cohens-kappa, calibration]
editable: [agreement.py]
hints:
  - "Observed agreement `p_o` is the share of items where the two lists match. Expected agreement `p_e` sums, over every label either rater used, (share of first rater's items with that label) x (share of second rater's items with that label)."
  - "`kappa = (p_o - p_e) / (1 - p_e)`. When `p_e` is exactly 1 both raters used one label throughout; return 1.0 instead of dividing by zero."
  - "To read a verdict, take the first whitespace-separated word of the reply, keep only its letters and upper-case them. Anything other than PASS or FAIL is a `ValueError`."
  - "`judge_labels` asks about each item in its own request, and puts both the rubric and the item in the user message."
checks:
  - id: kappa
    title: Kappa is computed from observed and expected agreement
    test: test_agreement.py::test_kappa_values
  - id: degenerate
    title: One-label raters give 1.0, and bad input is rejected
    test: test_agreement.py::test_degenerate_cases
  - id: verdicts
    title: A judge's reply is read as PASS or FAIL, or rejected
    test: test_agreement.py::test_parse_verdict
  - id: judge-labels
    title: The judge is asked about each item separately, with the rubric
    test: test_agreement.py::test_judge_labels_follow_the_judge
    kind: behavioural
  - id: trust
    title: The report trusts the judge when kappa reaches the threshold
    test: test_agreement.py::test_report_trust_threshold
    kind: behavioural
