version: 3
title: Prompt injection basics
tier: intermediate
xp: 110
prerequisites: [starter.system-prompts]
skills: [prompt-injection, delimiters, security]
editable: [guarded.py]
hints:
  - "Put your rules in the system prompt and tell the model that the text inside the `<document>` tags is data to read, never instructions to follow. The document itself goes in the user message."
  - "An attacker's document can contain its own `</document>` to 'close' your delimiter early. Whatever you do to the document, the final prompt must contain exactly one opening and one closing tag."
  - "Neutralise look-alikes by escaping the angle brackets in the document (`<` to `&lt;`, `>` to `&gt;`) before wrapping it. That catches every spelling: `</DOCUMENT>`, `< /document >` and the rest."
checks:
  - id: instructions-in-system
    title: Rules live in the system prompt, untrusted text does not
    test: test_guarded.py::test_instructions_live_in_system_prompt
  - id: wrapped
    title: The document is wrapped in delimiters, ahead of the question
    test: test_guarded.py::test_document_is_wrapped_in_delimiters
  - id: lookalikes
    title: Delimiter look-alikes inside the document are neutralised
    test: test_guarded.py::test_delimiter_lookalikes_are_neutralised
