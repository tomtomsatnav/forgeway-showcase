version: 3
title: The initialise handshake
tier: beginner
xp: 100
prerequisites: [protocols.json-rpc-dispatch]
skills: [mcp, capability-negotiation, lifecycle]
editable: [handshake.py]
hints:
  - "The client proposes a revision. If your `supported_versions` contains it, reply with exactly that. If not, reply with the first entry of `supported_versions`, your preferred revision, and let the client decide whether it can live with it."
  - "Keep two pieces of state: whether `initialize` has been answered, and whether `notifications/initialized` has arrived. Only `ping` is allowed before the first."
  - "Validate `initialize` params *before* you change any state: a failed handshake must leave the server uninitialised so the client can try again."
checks:
  - id: negotiation
    title: Agrees a protocol revision, or offers its own preferred one
    test: test_handshake.py::test_version_negotiation
  - id: result
    title: The initialize result carries the version, capabilities and server info
    test: test_handshake.py::test_initialize_result
  - id: lifecycle
    title: Refuses work until initialised; only the notification marks it ready
    test: test_handshake.py::test_lifecycle
  - id: bad-params
    title: Rejects a malformed initialize without changing state
    test: test_handshake.py::test_bad_initialize_params
