version: 2
title: Semantic facts and contradictions
tier: intermediate
xp: 110
prerequisites: [memory.rolling-summary]
skills: [memory, semantic-memory, conflict-resolution, normalisation]
editable: [facts.py]
hints:
  - "Key the store on `(subject.strip().lower(), attribute.strip().lower())`. Keep the current `Fact` for each key in one dict and the superseded ones in another, oldest first."
  - "Work through the rules in the brief's order: nothing stored, same value, older claim, less trusted claim, tie, then the update. Return as soon as one applies."
  - "Rank sources with `{\"user\": 3, \"document\": 2, \"inferred\": 1}`. A confirmation keeps the stored wording but may raise `at` and the source; use `dataclasses.replace`."
checks:
  - id: add-and-confirm
    title: New facts are added and repeats confirm the stored one
    test: test_facts.py::test_adding_and_confirming
  - id: updates
    title: A newer claim replaces the value and the old one goes to history
    test: test_facts.py::test_updates_keep_history
  - id: contradictions
    title: Stale, less trusted and tied claims are refused, by the stated rule
    test: test_facts.py::test_contradiction_rules
  - id: normalisation
    title: Subjects and attributes ignore case and surrounding space
    test: test_facts.py::test_keys_are_normalised
  - id: retract
    title: Retracting removes the fact and its history
    test: test_facts.py::test_retract_removes_everything
