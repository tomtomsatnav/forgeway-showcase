# Journal retention for the shared VPS. Install as
# /etc/systemd/journald.conf.d/forgeway.conf, then: systemctl restart systemd-journald
#
# Caps the journal's disk use and keeps 30 days, which covers incident review without holding
# client IP addresses for longer than the privacy policy needs. Container logs use Docker's
# "local" driver (daemon.json), which rotates on its own (5 x 20 MB per container by default).
[Journal]
Storage=persistent
SystemMaxUse=500M
SystemKeepFree=2G
MaxRetentionSec=30day
