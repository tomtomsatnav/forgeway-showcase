# Docker API allow-list between the grading worker and the Docker daemon (see docs/adr/0010).
#
# Mounted over the template of tecnativa/docker-socket-proxy, whose entrypoint fills in
# ${BIND_CONFIG}. Everything not allowed below is refused with 403. The worker's docker CLI
# needs exactly these calls for `docker run --rm -i`, `docker kill`, `docker ps` and
# `docker inspect`:
#
#   HEAD/GET /_ping, GET /version
#   POST     /containers/create?name=lattice-grade-<12 hex>   (body checked below)
#   POST     /containers/<64-hex id>/attach|start|wait        (`docker run` uses the id it created)
#   POST     /containers/lattice-grade-<12 hex>/kill          (`docker kill <name>`)
#   GET      /containers/json?filters={"label":{"lattice.role=grader":true}}   (`docker ps`)
#   GET      /containers/<12 hex>/json                        (`docker inspect` of those ids)
#
# (`--rm` is done by the daemon, so no DELETE; the image is built locally, so no pull.)
#
# Only grading containers can be named or found. The list must carry the grader label filter,
# exactly as the CLI sends it, and inspect takes a 12-hex id, so the worker can learn the ids of
# grading containers only. Attach, start and wait take a full 64-hex id (a short prefix could be
# guessed) and kill takes a grading container's name, so the worker cannot attach to, wait on or
# kill the other site's containers, or the stack's own. Re-check these with the probes in ADR 0010
# after a docker CLI upgrade.
#
# A path list alone would still let a compromised worker create a privileged container with the
# host's root mounted, so container-create bodies are checked too: only a sandbox image, with no
# network, a read-only root, no host mounts, devices or host namespaces, every capability dropped
# but the three the sandbox's launcher needs to run learner code as a second user (SETUID, SETGID,
# KILL; see docs/adr/0009), and no-new-privileges.
# The checks are case-insensitive (Go's JSON decoder matches keys that way) and refuse escapes
# and non-ASCII bytes, so a key cannot be spelt to slip past them.

global
    log stdout format raw daemon info
    maxconn 200

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    timeout http-request 10s
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    # `docker run -i` upgrades the attach request to a raw stream for the length of the run.
    timeout tunnel 10m

backend dockerbackend
    server dockersocket /var/run/docker.sock

frontend dockerfrontend
    bind ${BIND_CONFIG}
    option http-buffer-request
    default_backend dockerbackend

    acl ping            path,url_dec -m reg '^(/v[0-9.]+)?/_ping$'
    acl version         path,url_dec -m reg '^(/v[0-9.]+)?/version$'
    acl c_list          path,url_dec -m reg '^(/v[0-9.]+)?/containers/json$'
    acl q_graders       query,url_dec -m reg '^filters=\{"label":\{"lattice\.role=grader":true\}\}$'
    acl c_inspect       path,url_dec -m reg '^(/v[0-9.]+)?/containers/[0-9a-f]{12}/json$'
    acl c_create        path,url_dec -m reg '^(/v[0-9.]+)?/containers/create$'
    acl q_grade_name    query,url_dec -m reg '^name=lattice-grade-[0-9a-f]{12}$'
    acl c_run           path,url_dec -m reg '^(/v[0-9.]+)?/containers/[0-9a-f]{64}/(attach|start|wait)$'
    acl c_kill          path,url_dec -m reg '^(/v[0-9.]+)?/containers/lattice-grade-[0-9a-f]{12}/kill$'

    # Container-create bodies: refuse anything that could reach the host.
    acl body_small      req.hdr_val(content-length) le 16384
    acl body_odd        req.body -m reg '\\u|[^\x09\x0a\x0d\x20-\x7e]'
    acl body_sandbox    req.body -m reg -i '"image"\s*:\s*"[a-z0-9.-]*sandbox-python:[A-Za-z0-9_.-]+"'
    acl body_image_else req.body -m reg -i '"image"\s*:\s*"(?![a-z0-9.-]*sandbox-python:[A-Za-z0-9_.-]+")'
    acl body_net_none   req.body -m reg -i '"networkmode"\s*:\s*"none"'
    acl body_net_else   req.body -m reg -i '"networkmode"\s*:\s*"(?!none")'
    acl body_readonly   req.body -m reg -i '"readonlyrootfs"\s*:\s*true'
    acl body_readwrite  req.body -m reg -i '"readonlyrootfs"\s*:\s*false'
    acl body_privileged req.body -m reg -i '"privileged"\s*:\s*true'
    acl body_mounts     req.body -m reg -i '"(binds|mounts|volumesfrom|devices|devicecgrouprules|devicerequests)"\s*:\s*\[\s*[^\s\]]'
    acl body_volumes    req.body -m reg -i '"volumes"\s*:\s*\{\s*"'
    # Every capability dropped, then at most SETUID, SETGID and KILL added back (the CLI may send
    # them as CAP_SETUID and so on), and no-new-privileges, so no exec can regain any.
    acl body_capdrop_all req.body -m reg -i '"capdrop"\s*:\s*\[\s*"(cap_)?all"\s*\]'
    acl body_capadd_else req.body -m reg -i '"capadd"\s*:\s*\[(?!(\s*"(cap_)?(setuid|setgid|kill)"\s*,?)*\s*\])'
    acl body_nnp        req.body -m reg -i '"securityopt"\s*:\s*\[\s*"no-new-privileges(:true)?"\s*\]'
    acl body_host_ns    req.body -m reg -i '"(pidmode|ipcmode|usernsmode|utsmode|cgroupnsmode)"\s*:\s*"(host|container:)'
    acl body_cgroup     req.body -m reg -i '"(cgroupparent|cgroup)"\s*:\s*"[^"]'
    acl body_sysctls    req.body -m reg -i '"sysctls"\s*:\s*\{\s*"'
    acl body_unconfined req.body -m reg -i 'unconfined|seccomp|apparmor|label[:=]disable|systempaths'
    # The daemon's default masked and read-only /proc and /sys paths stay as they are.
    acl body_paths      req.body -m reg -i '"(maskedpaths|readonlypaths)"\s*:\s*\[\s*[^\s\]]'
    acl body_oom        req.body -m reg -i '"oomkilldisable"\s*:\s*true'
    acl body_runsc      req.body -m reg -i '"runtime"\s*:\s*"runsc"'
    acl body_runtime_else req.body -m reg -i '"runtime"\s*:\s*"(?!runsc")'

    http-request deny if c_create !METH_POST
    http-request deny if c_create !body_small || c_create body_odd
    http-request deny if c_create !body_sandbox || c_create body_image_else
    http-request deny if c_create !body_net_none || c_create body_net_else
    http-request deny if c_create !body_readonly || c_create body_readwrite
    http-request deny if c_create body_privileged || c_create body_mounts || c_create body_volumes
    http-request deny if c_create !body_capdrop_all || c_create body_capadd_else || c_create !body_nnp
    http-request deny if c_create body_host_ns || c_create body_cgroup || c_create body_sysctls
    http-request deny if c_create body_unconfined || c_create body_oom || c_create body_paths
    http-request deny if c_create !q_grade_name
    # Production sets REQUIRE_RUNSC=1 so every sandbox runs under gVisor.
    http-request deny if c_create { env(REQUIRE_RUNSC) -m bool } !body_runsc
    http-request deny if c_create { env(REQUIRE_RUNSC) -m bool } body_runtime_else

    http-request allow if ping METH_GET || ping METH_HEAD
    http-request allow if version METH_GET
    http-request allow if c_list METH_GET q_graders || c_inspect METH_GET
    http-request allow if c_create METH_POST || c_run METH_POST || c_kill METH_POST
    http-request deny
